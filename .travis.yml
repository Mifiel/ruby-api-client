language: generic
sudo: false

cache:
  directories:
    - $HOME/.local/share/mise
    - vendor/bundle

env:
  - RUBY_VERSION=3.2 BUNDLE_GEMFILE=gemfiles/rails_6.gemfile
  - RUBY_VERSION=3.2 BUNDLE_GEMFILE=gemfiles/rails_7.gemfile
  - RUBY_VERSION=3.2 BUNDLE_GEMFILE=gemfiles/rails_8.gemfile
  - RUBY_VERSION=3.3 BUNDLE_GEMFILE=gemfiles/rails_6.gemfile
  - RUBY_VERSION=3.3 BUNDLE_GEMFILE=gemfiles/rails_7.gemfile
  - RUBY_VERSION=3.3 BUNDLE_GEMFILE=gemfiles/rails_8.gemfile
  - RUBY_VERSION=3.4 BUNDLE_GEMFILE=gemfiles/rails_6.gemfile
  - RUBY_VERSION=3.4 BUNDLE_GEMFILE=gemfiles/rails_7.gemfile
  - RUBY_VERSION=3.4 BUNDLE_GEMFILE=gemfiles/rails_8.gemfile
  - RUBY_VERSION=4.0 BUNDLE_GEMFILE=gemfiles/rails_6.gemfile
  - RUBY_VERSION=4.0 BUNDLE_GEMFILE=gemfiles/rails_7.gemfile
  - RUBY_VERSION=4.0 BUNDLE_GEMFILE=gemfiles/rails_8.gemfile

before_install:
  - curl https://mise.run | sh
  - export PATH="$HOME/.local/bin:$PATH"
  - mise install ruby@$RUBY_VERSION
  - eval "$(mise env --shell bash ruby@$RUBY_VERSION)"
  - ruby -v

install:
  - bundle install --jobs=3 --retry=3 --path vendor/bundle

notifications:
  email:
    on_success: change
    on_failure: always

script:
  - mkdir ./tmp/
  - bundle exec rubocop
  - bundle exec rspec
